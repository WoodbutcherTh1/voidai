<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" role="img" aria-label="VoidAI by WoodbutcherTh1">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0a1e"/>
      <stop offset="0.5" stop-color="#140d2e"/>
      <stop offset="1" stop-color="#05040f"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c5cff"><animate attributeName="stop-color" values="#7c5cff;#22d3ee;#f472b6;#7c5cff" dur="8s" repeatCount="indefinite"/></stop>
      <stop offset="0.5" stop-color="#22d3ee"><animate attributeName="stop-color" values="#22d3ee;#f472b6;#7c5cff;#22d3ee" dur="8s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#f472b6"><animate attributeName="stop-color" values="#f472b6;#7c5cff;#22d3ee;#f472b6" dur="8s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>

    <style>
      .twinkle { animation: tw 3s ease-in-out infinite; }
      .t2 { animation-delay: .7s } .t3 { animation-delay: 1.4s } .t4 { animation-delay: 2.1s }
      @keyframes tw { 0%,100% { opacity:.18 } 50% { opacity:.9 } }

      .drift { animation: dr 18s linear infinite; }
      @keyframes dr { from { transform: translateX(0) } to { transform: translateX(-500px) } }

      .rise { opacity: 0; animation: rise .9s cubic-bezier(.16,1,.3,1) forwards; }
      .d1 { animation-delay:.15s } .d2 { animation-delay:.4s } .d3 { animation-delay:.65s }
      @keyframes rise { to { opacity:1; transform: translateY(0) } }

      .caret { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 0%,49% { opacity:1 } 50%,100% { opacity:0 } }

      .sweep { animation: sw 6s ease-in-out infinite; }
      @keyframes sw { 0%,100% { transform: translateX(-180px); opacity:0 } 45% { opacity:.5 } 55% { opacity:.5 } 100% { transform: translateX(1100px) } }

      .orbit { transform-origin: 862px 130px; animation: orb 14s linear infinite; }
      @keyframes orb { to { transform: rotate(360deg) } }
    </style>
  </defs>

  <rect width="1000" height="260" fill="url(#sky)"/>

  <g class="drift">
    <g fill="#ffffff">
      <circle class="twinkle" cx="60" cy="40" r="1.6"/><circle class="twinkle t2" cx="180" cy="90" r="1.2"/>
      <circle class="twinkle t3" cx="300" cy="35" r="1.5"/><circle class="twinkle t4" cx="420" cy="120" r="1.1"/>
      <circle class="twinkle t2" cx="540" cy="60" r="1.4"/><circle class="twinkle" cx="660" cy="150" r="1.2"/>
      <circle class="twinkle t3" cx="780" cy="45" r="1.5"/><circle class="twinkle t4" cx="900" cy="110" r="1.3"/>
      <circle class="twinkle" cx="1060" cy="40" r="1.6"/><circle class="twinkle t2" cx="1180" cy="90" r="1.2"/>
      <circle class="twinkle t3" cx="1300" cy="35" r="1.5"/><circle class="twinkle t4" cx="1420" cy="120" r="1.1"/>
      <circle class="twinkle t2" cx="1540" cy="60" r="1.4"/>
    </g>
  </g>

  <ellipse cx="250" cy="150" rx="260" ry="120" fill="url(#halo)" filter="url(#soft)"/>

  <g class="orbit">
    <circle cx="862" cy="130" r="70" fill="none" stroke="#7c5cff" stroke-opacity="0.28" stroke-width="1.5" stroke-dasharray="4 7"/>
    <circle cx="932" cy="130" r="5" fill="#22d3ee"/>
  </g>
  <circle cx="862" cy="130" r="26" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.5"/>
  <text x="862" y="139" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="22" fill="#c7d2fe" text-anchor="middle">{ }</text>

  <g class="rise d1" transform="translate(0,14)">
    <text x="70" y="112" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="72" font-weight="800"
          letter-spacing="-2" fill="url(#word)">VoidAI</text>
  </g>

  <g class="rise d2" transform="translate(0,12)">
    <text x="74" y="152" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17" fill="#a5b4fc">
      calm, multilingual AI workspace<tspan class="caret" fill="#22d3ee">▌</tspan>
    </text>
  </g>

  <g class="rise d3" transform="translate(0,10)">
    <rect x="70" y="182" width="196" height="30" rx="15" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="88" y="202" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" fill="#e0e7ff">@WoodbutcherTh1</text>

    <rect x="278" y="182" width="106" height="30" rx="15" fill="#7c5cff" fill-opacity="0.16" stroke="#7c5cff" stroke-opacity="0.5"/>
    <text x="296" y="202" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" fill="#c4b5fd">Next.js 16</text>

    <rect x="396" y="182" width="118" height="30" rx="15" fill="#22d3ee" fill-opacity="0.14" stroke="#22d3ee" stroke-opacity="0.45"/>
    <text x="414" y="202" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" fill="#a5f3fc">OpenRouter</text>

    <rect x="526" y="182" width="90" height="30" rx="15" fill="#f472b6" fill-opacity="0.14" stroke="#f472b6" stroke-opacity="0.45"/>
    <text x="544" y="202" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" fill="#fbcfe8">Docker</text>
  </g>

  <g class="sweep">
    <rect x="0" y="0" width="90" height="260" fill="#ffffff" fill-opacity="0.05" transform="skewX(-18)"/>
  </g>

  <rect x="0" y="256" width="1000" height="4" fill="url(#word)"/>
</svg>
